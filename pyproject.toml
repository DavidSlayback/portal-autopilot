[project]
name = "portal-autopilot"
version = "0.1.0"
description = "Reconcile provider bills against insurer EOBs pulled from login-only portals."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
autopilot = "autopilot.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
